---
layout: default
title: tip jar
description: Support eboshii.
full_width: true
---

<div class="tip-page-centered">
  <div class="kofi-dither-wrapper">
    <canvas id="kofi-dither-canvas" class="kofi-dither-canvas" aria-hidden="true"></canvas>
  </div>
</div>

<script>
(function() {
  function initTipPage() {
    const wrapper = document.querySelector('.kofi-dither-wrapper');
    const canvas = document.getElementById('kofi-dither-canvas');
    const preloaded = document.getElementById('global-kofi-iframe');

    if (!wrapper || !canvas) return;

    // Mount preloaded Ko-fi iframe
    if (preloaded && preloaded.parentElement !== wrapper) {
      wrapper.appendChild(preloaded);
    }

    const ctx = canvas.getContext('2d');
    const PIXEL_SCALE = 3; // 3px resolution matching nebula background
    const FADE_PIXELS = 36; // Exterior continuous gradient border
    const FADE_CELLS = 12;  
    const CORNER_RADIUS = 8; // 8px matching .kofi-page-iframe border-radius

    // Normalized 4x4 Bayer Matrix [-0.5, +0.5] matching WebGL shader
    const BAYER_4X4_NORM = [
      [-0.5000,  0.0000, -0.3750,  0.1250],
      [ 0.2500, -0.2500,  0.3750, -0.1250],
      [-0.3125,  0.1875, -0.4375,  0.0625],
      [ 0.4375, -0.0625,  0.3125, -0.1875]
    ];

    function renderDitherEdge() {
      const rect = wrapper.getBoundingClientRect();
      const wBox = Math.round(rect.width);
      const hBox = Math.round(rect.height);

      const wTotal = wBox + FADE_PIXELS * 2;
      const hTotal = hBox + FADE_PIXELS * 2;

      canvas.width = wTotal;
      canvas.height = hTotal;
      canvas.style.width = wTotal + 'px';
      canvas.style.height = hTotal + 'px';

      const cols = Math.ceil(wTotal / PIXEL_SCALE);
      const rows = Math.ceil(hTotal / PIXEL_SCALE);

      const cx = cols / 2.0;
      const cy = rows / 2.0;
      const hw = (wBox / 2.0) / PIXEL_SCALE;
      const hh = (hBox / 2.0) / PIXEL_SCALE;
      const rCells = CORNER_RADIUS / PIXEL_SCALE; // ~2.67 cells

      ctx.clearRect(0, 0, wTotal, hTotal);

      // Quantization levels matching nebula WebGL shader
      const QUANT_LEVELS = 14.0;

      for (let gy = 0; gy < rows; gy++) {
        for (let gx = 0; gx < cols; gx++) {
          const px = (gx + 0.5) - cx;
          const py = (gy + 0.5) - cy;

          // Exact Signed Distance Field (SDF) to rounded card contour
          const qx = Math.abs(px) - (hw - rCells);
          const qy = Math.abs(py) - (hh - rCells);

          const extX = Math.max(qx, 0.0);
          const extY = Math.max(qy, 0.0);
          const dist = Math.hypot(extX, extY) + Math.min(Math.max(qx, qy), 0.0) - rCells;

          if (dist > 0.0 && dist <= FADE_CELLS) {
            // Smooth continuous falloff curve
            const u = dist / FADE_CELLS;
            const continuousAlpha = (1.0 - u) * (1.0 - u) * (3.0 - 2.0 * (1.0 - u));

            // Apply 4x4 Bayer dither perturbation (same amplitude as WebGL background)
            const ditherOffset = BAYER_4X4_NORM[gy % 4][gx % 4] * 0.16;
            const ditheredAlpha = continuousAlpha + ditherOffset;

            // Discrete retro 14-level quantization
            const clamped = Math.max(0.0, Math.min(1.0, ditheredAlpha));
            const quantAlpha = Math.floor(clamped * QUANT_LEVELS + 0.5) / QUANT_LEVELS;

            if (quantAlpha > 0.02) {
              ctx.fillStyle = `rgba(255, 255, 255, ${quantAlpha})`;
              ctx.fillRect(gx * PIXEL_SCALE, gy * PIXEL_SCALE, PIXEL_SCALE, PIXEL_SCALE);
            }
          }
        }
      }
    }

    window.addEventListener('resize', renderDitherEdge);
    renderDitherEdge();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTipPage);
  } else {
    initTipPage();
  }
})();
</script>
