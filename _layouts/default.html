<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} &mdash; {% endif %}eboshii</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="{{ '/assets/images/nebula-poster.webp' | relative_url }}" as="image" type="image/webp">
  <link rel="preload" href="{{ '/assets/js/nebula-bg.js' | relative_url }}?v={{ site.time | date: '%s' }}" as="script">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://ko-fi.com">
  <link rel="dns-prefetch" href="https://ko-fi.com">
  <link rel="preload" href="https://ko-fi.com/Scripts/sections/profile.js?v=534ca" as="script" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        renderActions: {
          findScript: [10, function (doc) {
            for (const node of document.querySelectorAll('script[type^="math/tex"]')) {
              const display = !!node.type.match(/mode=display/);
              const math = new doc.options.MathItem(node.textContent, doc.input[0], display);
              const text = document.createTextNode('');
              node.parentNode.replaceChild(text, node);
              math.start = {node: text, delim: '', n: 0};
              math.end = {node: text, delim: '', n: 0};
              doc.math.push(math);
            }
          }, '']
        }
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.mermaid) {
        mermaid.initialize({ startOnLoad: true, theme: 'default' });
      }
    });
  </script>
  {% if page.scripts %}
    {% for script in page.scripts %}
  <script src="{{ script }}"></script>
    {% endfor %}
  {% endif %}
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <canvas id="nebula-bg"></canvas>
  <script src="{{ '/assets/js/nebula-bg.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

  <header>
    <nav class="{% if page.full_width %}nav-wide{% endif %}">
      <a class="site-title" href="{{ '/' | relative_url }}">eboshii</a>
      <div class="nav-links">
        <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' or page.url contains '/artificial-life' or page.url contains '/quant' or page.url contains '/travel' %} class="active"{% endif %}>blog</a>
        <a href="{{ '/pre-ipo/' | relative_url }}"{% if page.url contains '/pre-ipo' %} class="active"{% endif %}>pre-ipo</a>
        <a href="{{ '/news/' | relative_url }}"{% if page.url contains '/news' %} class="active"{% endif %}>news</a>
        <div class="nav-dropdown">
          <button class="nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false">
            <span>games</span>
            <svg class="dropdown-chevron" viewBox="0 0 10 6" width="8" height="6" fill="currentColor">
              <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="nav-dropdown-menu">
            <a href="https://eboshii.github.io/Paperclips/">Objective: Paperclips</a>
            <a href="https://eboshii.github.io/predichess/">Predichess</a>
            <a href="https://eboshiidev.itch.io/emergence" target="_blank" rel="noopener noreferrer">Emergence</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="{% if page.full_width %}main-wide{% endif %}{% if page.url contains '/tip' %} main-tip{% endif %}">
    {{ content }}
  </main>

  <footer>
    <div class="footer-inner">
      <span>&copy; {{ site.time | date: '%Y' }} eboshii</span>
      <span class="footer-sep">&middot;</span>
      <a href="{{ '/stats/' | relative_url }}" class="footer-stats-link{% if page.url contains '/stats' %} active{% endif %}">stats</a>
      <span class="footer-sep">&middot;</span>
      <a href="{{ '/tip/' | relative_url }}" class="footer-stats-link{% if page.url contains '/tip' %} active{% endif %}">tip jar</a>
    </div>
  </footer>

  <!-- Permanent Global Ko-fi Container (Zero-reparenting to prevent iframe reload) -->
  <div id="global-kofi-host" class="global-kofi-host{% if page.url contains '/tip' %} active{% endif %}" aria-label="Ko-fi donation widget">
    <iframe id="global-kofi-iframe" {% if page.url contains '/tip' %}src="https://ko-fi.com/eboshii/?hidefeed=true&widget=true&embed=true"{% else %}data-src="https://ko-fi.com/eboshii/?hidefeed=true&widget=true&embed=true"{% endif %} class="kofi-page-iframe" title="Support eboshii on Ko-fi"></iframe>
  </div>

  <script src="{{ '/assets/js/tracker.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script src="{{ '/assets/js/instant-nav.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script src="{{ '/assets/js/boat-easter-egg.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
