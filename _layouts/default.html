<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} &mdash; {% endif %}eboshii</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if page.math %}
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
  {% endif %}
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: true, theme: 'default' });
    mermaid.contentLoaded();
  </script>
  {% if page.scripts %}
    {% for script in page.scripts %}
  <script src="{{ script }}"></script>
    {% endfor %}
  {% endif %}
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <header>
    <nav>
      <a class="site-title" href="{{ '/' | relative_url }}">eboshii</a>
      <div class="nav-links">
        <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' or page.url contains '/artificial-life' or page.url contains '/quant' or page.url contains '/travel' %} class="active"{% endif %}>blog</a>
        <a href="{{ '/pre-ipo/' | relative_url }}"{% if page.url contains '/pre-ipo' %} class="active"{% endif %}>pre-ipo</a>
        <a href="https://eboshii.github.io/predichess/">predichess</a>
      </div>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>&copy; {{ site.time | date: '%Y' }} eboshii</p>
  </footer>
</body>
</html>
